name: CI

# The green checkpoint on Linux for every pull request and push to main, plus the platforms
# workflow on macOS, Windows and Linux for each of them that changes more than docs, specs and
# skills. A pull request runs the smoke journeys there and a push to main runs every journey. The
# platforms job is the one check that says whether that proof passed.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - run: ./scripts/check
      - run: npm run build

  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      app: ${{ steps.diff.outputs.app }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - id: diff
        run: |
          docs='^([^/]+\.md|specs/.+|\.claude/skills/.+|\.github/pull_request_template\.md|\.github/ISSUE_TEMPLATE/.+)$'
          app=true
          if changed=$(git diff --no-renames --name-only HEAD^1 HEAD); then
            found=0
            grep -qvE "$docs" <<<"$changed" || found=$?
            [ "$found" -ne 1 ] || app=false
          fi
          echo "app=$app"
          echo "app=$app" >> "$GITHUB_OUTPUT"

  prove:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    uses: ./.github/workflows/platforms.yml
    with:
      smoke: ${{ github.event_name == 'pull_request' }}

  platforms:
    needs: [changes, prove]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - run: |
          echo "changes $CHANGES, app $APP, prove $PROVE"
          case "$CHANGES/$APP/$PROVE" in
            success/true/success | success/false/skipped) ;;
            *) exit 1 ;;
          esac
        env:
          APP: ${{ needs.changes.outputs.app }}
          CHANGES: ${{ needs.changes.result }}
          PROVE: ${{ needs.prove.result }}
