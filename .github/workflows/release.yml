name: Release

# Packages Satellite on three platforms and proves each packaged app with the journeys. A tag drafts
# a release, a platforms/ branch only builds and proves, so the matrix can run before a merge.
on:
  push:
    tags: ["v*"]
    branches: ["platforms/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26
            label: macos
            package: --mac --arm64 --x64
            app: release/mac-arm64/Satellite.app/Contents/MacOS/Satellite
          - os: windows-2025
            label: windows
            package: --win --x64
            app: release/win-unpacked/Satellite.exe
          - os: ubuntu-24.04
            label: linux
            package: --linux --x64
            app: release/linux-unpacked/satellite
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx electron-builder ${{ matrix.package }} --publish never
      - run: npx @electron/fuses read --app "${{ matrix.app }}"
      - if: runner.os == 'Linux'
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          command -v xvfb-run || { sudo apt-get update && sudo apt-get install -y xvfb; }
      - if: runner.os == 'Linux'
        run: xvfb-run -a npm run journeys -- --app "${{ matrix.app }}"
      - if: runner.os != 'Linux'
        run: npm run journeys -- --app "${{ matrix.app }}"
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verify-output-${{ matrix.label }}
          if-no-files-found: ignore
          path: verify-output/
      - run: node scripts/checksums.ts release ${{ matrix.label }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: satellite-${{ matrix.label }}
          if-no-files-found: error
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.deb
            release/SHA256SUMS-*.txt

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - run: cat dist/SHA256SUMS-*.txt > dist/SHA256SUMS.txt && rm dist/SHA256SUMS-*.txt
      - run: gh release create "$GITHUB_REF_NAME" dist/* --draft --verify-tag --title "Satellite $GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
