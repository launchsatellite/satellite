# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: en-GB
inheritance: false
early_access: false
tone_instructions: "Concise and dense, smart and friendly. One finding per comment, each with the concrete failure it causes. Skip praise and restating the diff."
reviews:
  profile: chill
  high_level_summary: true
  high_level_summary_in_walkthrough: true
  auto_approvals:
    enabled: true
    allow_author_approval: false
  pre_merge_checks:
    override_requested_reviewers_only: true
  finishing_touches:
    autofix:
      enabled: false
    fix_ci:
      enabled: false
    resolve_merge_conflict:
      enabled: false
    unit_tests:
      enabled: false
    simplify:
      enabled: false
    custom: []
  post_merge_actions: []
chat:
  allow_non_org_members: false
issue_enrichment:
  auto_enrich:
    enabled: false
  planning:
    enabled: false
    auto_planning:
      enabled: false
  labeling:
    auto_apply_labels: false
