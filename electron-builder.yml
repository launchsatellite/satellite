appId: app.satellite.desktop
productName: Satellite
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
directories:
  output: release
  buildResources: packaging
files:
  - out/**
  - package.json
  - "!node_modules/node-pty/prebuilds/!(${platform}-${arch})/**"
  - "!node_modules/node-pty/{deps,src,scripts,third_party}/**"
asar: true
asarUnpack:
  - node_modules/node-pty/**
npmRebuild: false
publish: null
electronFuses:
  runAsNode: false
  enableCookieEncryption: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  grantFileProtocolExtraPrivileges: false
mac:
  target: [dmg, zip]
  category: public.app-category.developer-tools
  identity: "-"
  hardenedRuntime: false
win:
  target: nsis
linux:
  target: [AppImage, deb]
  category: Development
  executableName: satellite
  maintainer: Satellite
